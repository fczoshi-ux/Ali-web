<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Cleaner Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
            padding: 30px 25px;
        }
        h1 {
            color: #2d3748;
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .sub-title {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            resize: none;
            margin-bottom: 15px;
            transition: border 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .btn-clean {
            background: #667eea;
            color: white;
        }
        .btn-copy {
            background: #48bb78;
            color: white;
        }
        .btn-clear {
            background: #f56565;
            color: white;
        }
        .result-box {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            word-break: break-all;
            font-size: 14px;
            color: #2d3748;
            min-height: 60px;
            margin-bottom: 10px;
        }
        .info {
            font-size: 12px;
            color: #718096;
            margin-top: 10px;
            text-align: center;
        }
        .success {
            background: #c6f6d5;
            color: #22543d;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Link Cleaner Generator</h1>
        <p class="sub-title">Hapus pelacak, parameter sampah & bersihkan tautan Anda</p>

        <div class="success" id="successMsg">✅ Berhasil disalin ke papan klip!</div>

        <textarea id="inputLink" placeholder="Tempel tautan di sini... Contoh: https://example.com/produk?id=123&utm_source=fb&fbclid=abc123"></textarea>

        <div class="btn-group">
            <button class="btn-clean" onclick="bersihkanLink()">✨ Bersihkan Tautan</button>
            <button class="btn-copy" onclick="salinHasil()">📋 Salin Hasil</button>
            <button class="btn-clear" onclick="kosongkanSemua()">🗑️ Kosongkan</button>
        </div>

        <div class="result-box" id="hasilLink">Hasil tautan bersih akan muncul di sini...</div>

        <p class="info">⚠️ Catatan: Tidak mengubah isi tujuan tautan, hanya membuang kode pelacak & parameter tambahan.</p>
    </div>

    <script>
        const DAFTAR_HAPUS = [
            'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content',
            'fbclid', 'gclid', 'igshid', 'ref', 'source', 'from', 'mc_eid',
            'mc_cid', 'yclid', 'twclid', 'spm', 'usqp', 'ved',
            'sa', 'srsltid', 'mkt_tok', 'lkid', 'hsa_cam', 'hsa_ad',
            'hsa_grp', 'hsa_kw', 'hsa_mt', 'hsa_net', 'hsa_src'
        ];

        function bersihkanLink() {
            let input = document.getElementById('inputLink').value.trim();
            if (!input) {
                alert('⚠️ Masukkan tautan terlebih dahulu!');
                return;
            }

            try {
                const url = new URL(input);
                const params = new URLSearchParams(url.search);
                DAFTAR_HAPUS.forEach(key => params.delete(key));
                url.search = params.toString();

                let hasilBersih = url.toString();
                if (url.search === '') hasilBersih = hasilBersih.replace('?', '');
                document.getElementById('hasilLink').textContent = hasilBersih;
            } catch (err) {
                alert('❌ Tautan tidak valid! Pastikan dimulai dengan http:// atau https://');
            }
        }

        async function salinHasil() {
            const hasil = document.getElementById('hasilLink').textContent;
            if (!hasil || hasil.includes('akan muncul di sini')) {
                alert('⚠️ Belum ada hasil untuk disalin!');
                return;
            }
            try {
                await navigator.clipboard.writeText(hasil);
                const msg = document.getElementById('successMsg');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 2500);
            } catch (err) {
                const textArea = document.createElement('textarea');
                textArea.value = hasil;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                const msg = document.getElementById('successMsg');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 2500);
            }
        }

        function kosongkanSemua() {
            document.getElementById('inputLink').value = '';
            document.getElementById('hasilLink').textContent = 'Hasil tautan bersih akan muncul di sini...';
        }
    </script>
</body>
</html>
